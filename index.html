<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantilever Beam Topology Optimization &#183; Kanav Thonda</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#4A4A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#FFFFE3;--card:#FFFFEF;--accent:#6D8196;--accent2:#4A4A4A;--ink:#4A4A4A;--muted:#6D8196;--line:#CBCBCB;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*{transition:none!important;animation:none!important;}}
body{font-family:'Libre Baskerville',Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.7;}
.mono{font-family:'JetBrains Mono',monospace;}
em{font-style:italic;}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,227,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:10px 20px;}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-style:italic;padding:7px 12px;border-radius:6px;white-space:nowrap;transition:.15s;}
nav a:hover{color:var(--card);background:var(--accent);}
nav a.active{color:var(--bg);background:var(--accent2);}
nav a:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}
section{max-width:1180px;margin:0 auto;padding:72px 20px 8px;scroll-margin-top:64px;}
h2{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;line-height:1.25;}
h2 .num{color:var(--accent);font-weight:700;margin-right:12px;font-style:italic;}
.sub{color:var(--muted);font-size:14.5px;font-style:italic;margin-bottom:24px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px;}
/* hero */
.hero{background:var(--accent2);color:var(--bg);padding:96px 20px 80px;text-align:center;max-width:none;}
.hero .kicker{font-size:12.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--line);}
.hero h1{font-size:clamp(27px,4.2vw,46px);font-weight:400;letter-spacing:-.01em;max-width:920px;margin:18px auto 14px;line-height:1.22;}
.hero h1 em{color:#B8C6D4;font-style:italic;}
.hero .tagline{font-size:clamp(15px,2vw,19px);color:var(--line);font-style:italic;}
.hero .meta{margin-top:20px;font-size:14px;color:var(--line);}
.hero .btns{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero .btns a{background:var(--bg);color:var(--accent2);font-weight:700;font-size:14px;padding:12px 24px;border-radius:4px;text-decoration:none;transition:.15s;}
.hero .btns a.alt{background:var(--accent);color:var(--bg);}
.hero .btns a:hover{transform:translateY(-1px);}
/* metric cards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.metric{border-top:3px solid var(--accent);}
.metric.warn{border-top-color:var(--accent2);}
.metric .lab{font-size:11.5px;font-weight:400;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.metric .val{font-size:30px;font-weight:700;margin:8px 0 4px;letter-spacing:-.01em;}
.metric .val small{font-size:15px;font-weight:400;color:var(--muted);}
.metric .det{font-size:13px;color:var(--muted);line-height:1.6;}
/* how it works */
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;counter-reset:step;}
.howto .step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;counter-increment:step;}
.howto .step::before{content:counter(step,decimal-leading-zero);display:block;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);margin-bottom:10px;}
.howto .step h3{font-size:16.5px;font-weight:700;margin-bottom:8px;line-height:1.35;}
.howto .step h3 em{color:var(--accent);}
.howto .step p{font-size:13.5px;color:var(--muted);line-height:1.65;}
/* explorer */
.exp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;}
@media(max-width:820px){.exp-grid{grid-template-columns:minmax(0,1fr);}}
select,input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:4px;font-family:'Libre Baskerville',Georgia,serif;font-size:14px;background:var(--bg);color:var(--ink);}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.exp-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
@media(max-width:520px){.exp-row{grid-template-columns:1fr;}}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center;}
.stat .v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:17px;color:var(--accent2);}
.stat .k{font-size:10.5px;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.07em;margin-top:4px;}
#xsec{width:100%;height:auto;background:var(--bg);border:1px dashed var(--line);border-radius:6px;}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th{background:var(--accent2);color:var(--bg);padding:10px;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;font-size:12px;position:sticky;top:0;font-weight:700;}
